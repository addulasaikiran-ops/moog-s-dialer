name: Build MOOG Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '**.gradle'
      - '**.gradle.kts'
      - '**.kt'
      - '**.xml'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - '**.gradle'
      - '**.gradle.kts'
      - '**.kt'
      - '**.xml'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build and lint debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate and commit Gradle 8.11.1 wrapper
        shell: bash
        run: |
          gradle --no-daemon wrapper --gradle-version 8.11.1 --distribution-type bin
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add Gradle 8.11.1 wrapper"
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moog-dialer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
